<!doctype html>
<html lang="zh-CN" data-theme="cobalt-field">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>probe</title>
<link rel="stylesheet" href="field.css">
<style>
  /* 探针页专用：把提问框和结果卡都摆出来（不改产品样式） */
  body { padding: 24px; }
  .stage { width: 100%; max-width: 980px; }
  .hero { display: none; }
  .rail { display: block; }
  #thread:empty::before { content: "（等结果…）"; color: #999; }
</style>
</head>
<body class="field" data-mode="work">
<main class="stage">
  <div class="workspace">
    <section class="rail">
      <div class="thread" id="thread"></div>
      <form class="composer" id="composer" autocomplete="off">
        <div class="presets" id="presets"></div>
        <div class="box">
          <label class="sr" for="q">你要办什么</label>
          <div class="qwrap">
            <textarea id="q" rows="1" placeholder="一次问一件事，答得更准"></textarea>
            <span class="typer" id="typer"><span class="typer-text">问点什么</span></span>
          </div>
          <div class="boxfoot">
            <button class="plainbtn" type="button" id="clearbtn">主界面</button>
            <label class="llmsw" id="synthwrap">
              <input type="checkbox" id="synthsw" checked>
              <span class="track"><i></i></span>
              语言组织<span class="risk" id="synthrisk"></span>
            </label>
            <button class="send" type="submit" id="send">问</button>
          </div>
        </div>
      </form>
    </section>
    <aside class="inspector" id="inspector"></aside>
  </div>
</main>
<script>
  const P = new URLSearchParams(location.search);
  const Q = P.get("q") || "记过处分到期了，能评奖学金吗？能保研吗？";
  const SYNTH = P.get("synth") !== "0";
  const WAIT = Number(P.get("wait") || 18000);
  // typer 对齐探针：force=1 时把灰色提示强行留在我输入框里，好和真正输入的字同框对比
  const FORCE = P.get("force") === "1";
  window.__probe = { state: "boot" };
</script>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="field.js"></script>
<script>
  (async () => {
    const q = document.getElementById("q");
    const res = await fetch("/api/ask", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: Q, router_llm: false, synth: SYNTH }),
    });
    const data = await res.json();
    // 直接用产品自己的渲染入口：field.js 里 renderResult 挂在内部，这里复现它的分派
    const thread = document.getElementById("thread");
    const ev = new CustomEvent("probe-render", { detail: data });
    document.dispatchEvent(ev);
    window.__probe.data = data;
    window.__probe.state = "ready";
  })().catch((e) => { window.__probe.state = "error:" + e.message; });
</script>
</body>
</html>
